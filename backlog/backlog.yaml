# THE GOAL — canonical machine-readable delivery backlog.
#
# This file is the machine-readable authority for delivery automation.
# backlog/MASTER-BACKLOG.md is the human view generated from it; the two are
# not independent truths. See backlog/SCHEMA.md for the field reference.
#
# Dependencies are canonical complete ids. Shorthand (DCP-001, CONTRACT-001,
# CORE-001), wildcards (OPS-SAFE-*) and comma lists (TRON-T2,T3,T4) are not
# valid dependencies and are rejected by tools/goal-validate.
#
# target_repository is a *declared* target. Some declared repositories do not
# exist yet; that is expected and is never checked against GitHub.
#
# A canonical PID is required from DELIVERY_READY onward: no PID means not
# DELIVERY_READY. An item whose PID has not been authored yet belongs in a
# pre-delivery state, and PID_DRAFT is the state in which the PO authors one.
# ./tools/goal-ready --pid-wave lists the items waiting on exactly that;
# ./tools/goal-ready lists only what FORGE could actually be dispatched
# against.
items:
  - id: GOAL-DCP-001
    title: "GitHub control-plane authority: machine backlog, validation, dependency graph, strict delivery readiness, generated views, CI enforcement"
    lane: shared
    component: GOAL
    target_repository: maff0000/GOAL
    priority: P0
    risk: medium
    state: CLOSED
    depends_on: []
    po_gate: true
    matt_gate: false
    pid_path: pids/GOAL-DCP-001.md
    architecture_refs:
      - architecture/DELIVERY-CONTROL-PLANE.md
      - governance/DELIVERY-STATE-MACHINE.md
      - decisions/ADR-DELIVERY-001-GITHUB-AND-MEMORY-FABRIC.md

  # ROGUE consumes canonical GOAL state and safely dispatches independent
  # FORGE PLs without Matt mediating work selection. This is dispatch control,
  # NOT automated GitHub-triggered execution — that is GOAL-DCP-003.
  - id: GOAL-DCP-002
    title: "ROGUE dispatcher — deterministic consumption and multi-project dispatch control"
    lane: shared
    component: GOAL/ROGUE
    target_repository: maff0000/GOAL
    priority: P0
    risk: medium
    state: ARCHITECTURE_REQUIRED
    depends_on:
      - GOAL-DCP-001
    po_gate: true
    matt_gate: false
    pid_path: null
    architecture_refs:
      - architecture/DELIVERY-CONTROL-PLANE.md
      - governance/DELIVERY-STATE-MACHINE.md

  # Only after GOAL-DCP-002's dispatcher behaviour is proven. risk is high
  # because autonomous launch carries operational/execution-system impact; no
  # auto-merge is in scope here or anywhere else.
  - id: GOAL-DCP-003
    title: "Automated GitHub-triggered sandboxed delivery launch"
