    component: GOAL
    target_repository: maff0000/GOAL
    priority: P0
    risk: low
    state: DELIVERY_READY
    depends_on: []
    po_gate: true
    matt_gate: false
    pid_path: /pids/GOAL-DCP-001.md
    architecture_refs: []

  - id: ESCAPE-001
