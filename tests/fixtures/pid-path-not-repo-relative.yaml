# PID_FILE_NOT_FOUND: pid_path must be a repo-relative POSIX path resolved
# against the backlog's own repo_root. Neither of these is.
#
# Both items are DELIVERY_READY, which requires a canonical PID, so this is
# also the proof that a DELIVERY_READY item declaring a path that is not a
# usable repo-relative path is RED.
#
#   ABS-001     an absolute path. pathlib discards the root entirely when
#               joined with one, so without a guard this would read a file
#               outside the backlog's repository.
#   ESCAPE-001  a path that climbs out with '..'. This fixture's repo_root is
#               tests/, so without a guard this would resolve to the real
#               pids/GOAL-DCP-001.md and silently pass — a fixture's findings
#               would then depend on the repository around it.
items:
