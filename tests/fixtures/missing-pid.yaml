# MISSING_PID: state-conditional, and deliberately so.
#   ALPHA-001  FORGE_AUDIT means FORGE is already engaged, so a canonical PID
#              must exist; pid_path is null, which is the finding.
#   BETA-001   DELIVERY_READY with no PID is correct and must NOT be reported.
#              Authoring the PID is part of the dispatch that follows, so
#              demanding one here would make readiness unusable for exactly
#              the items it exists to surface.
items:
  - id: ALPHA-001
    title: "Alpha"
    lane: shared
    component: GOAL
    target_repository: maff0000/GOAL
    priority: P0
    risk: low
    state: FORGE_AUDIT
    depends_on: []
    po_gate: true
    matt_gate: false
    pid_path: null
    architecture_refs: []

  - id: BETA-001
    title: "Beta"
    lane: shared
    component: GOAL
    target_repository: maff0000/GOAL
    priority: P0
    risk: low
    state: DELIVERY_READY
    depends_on: []
    po_gate: true
    matt_gate: false
    pid_path: null
    architecture_refs: []
