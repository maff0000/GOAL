# Isolates: the PID clause of the dispatch-readiness rule, on its own.
#
# TARGET-001 is DELIVERY_READY and DEP-001 is CLOSED, so the state clause and
# the dependency clause are both satisfied. The only thing keeping TARGET-001
# out of the ready answer is that it declares no canonical PID -- pid_path is
# null. An item with no PID is not delivery-ready, however satisfied
# everything else about it is, so ROGUE must never be handed it.
#
# This is the data half of the two-layer PID rule. The validator owns the
# other half (the declared file must exist, be readable and agree with the
# backlog), and tests/fixtures/missing-pid.yaml proves this same item shape is
# RED there.
#
# DEP-001 declares an agreeing PID deliberately. CLOSED is a PID-required
# state, so with pid_path null this fixture produced a *second* MISSING_PID
# that had nothing to do with the clause under test -- two findings of the same
# code in one document, so a reader could not tell which one the fixture
# exists to prove. TARGET-001's MISSING_PID is now the only finding this
# document yields, which is what "on its own" above means and what
# tests/fixtures/README.md requires of every fixture here.
#
# Note the asymmetry is correct, not sloppiness: readiness does not care
# whether a *dependency* declares a PID, so the other dep_*.yaml fixtures
# leave DEP-001 without one. Here it matters only because the incidental
# finding collides with the code under test.
#
# DEP-001's PID is fixtures_readiness/pid-dep.md rather than the shared
# fixtures/pid-fixture.md, and that is minimum PID validity: a PID must name
# the item that declares it in its first heading, so a file headed PIDFIX-001
# cannot serve DEP-001 any more. Sharing it would trade the MISSING_PID this
# fixture used to produce incidentally for an equally incidental PID_INVALID.
items:
  - id: TARGET-001
    title: "Target item under test"
    lane: shared
    component: GOAL
    target_repository: maff0000/GOAL
    priority: P0
    risk: low
    state: DELIVERY_READY
    depends_on:
      - DEP-001
    po_gate: true
    matt_gate: false
    pid_path: null
    architecture_refs: []
  - id: DEP-001
    title: "Dependency under test"
    lane: shared
    component: GOAL
    target_repository: maff0000/GOAL
    priority: P0
    risk: low
    state: CLOSED
    depends_on: []
    po_gate: true
    matt_gate: false
    pid_path: fixtures_readiness/pid-dep.md
    architecture_refs: []
